name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Build, Lint & Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          PUBLIC_SITE_REPO_URL: ${{ vars.PUBLIC_SITE_REPO_URL }}
        run: npm run build

      - name: Verify compiled assets
        run: npm run check:assets

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.30.0"
          EXPECTED_SHA="79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
          curl -sSL -o "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${EXPECTED_SHA}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          sudo tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C /usr/local/bin gitleaks
          rm "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          gitleaks version

      - name: Secret Scan with Gitleaks
        run: gitleaks git --verbose --redact

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize and validate Terraform in infra/site
        run: |
          terraform -chdir=infra/site init -backend=false
          terraform -chdir=infra/site validate

  deploy:
    name: Build & Deploy to AWS
    needs: validate
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate required repository variables
        env:
          PUBLIC_SITE_OWNER: ${{ vars.PUBLIC_SITE_OWNER }}
          PUBLIC_SITE_NIE: ${{ vars.PUBLIC_SITE_NIE }}
          PUBLIC_SITE_ADDRESS: ${{ vars.PUBLIC_SITE_ADDRESS }}
          PUBLIC_SITE_EMAIL: ${{ vars.PUBLIC_SITE_EMAIL }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_SITE_LOGO_PATH: ${{ vars.PUBLIC_SITE_LOGO_PATH }}
          VECNOVA_BUCKET: ${{ vars.VECNOVA_BUCKET }}
          VECNOVA_DISTRIBUTION_ID: ${{ vars.VECNOVA_DISTRIBUTION_ID }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          MISSING_VARS=()
          for var_name in PUBLIC_SITE_OWNER PUBLIC_SITE_NIE PUBLIC_SITE_ADDRESS PUBLIC_SITE_EMAIL PUBLIC_SITE_URL PUBLIC_SITE_LOGO_PATH VECNOVA_BUCKET VECNOVA_DISTRIBUTION_ID AWS_ROLE_ARN; do
            if [ -z "${!var_name:-}" ]; then
              MISSING_VARS+=("$var_name")
            fi
          done

          if [ ${#MISSING_VARS[@]} -gt 0 ]; then
            echo "Error: Faltan las siguientes variables de repositorio requeridas para el despliegue:" >&2
            for missing in "${MISSING_VARS[@]}"; do
              echo "  - $missing" >&2
            done
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Deploy to S3 and CloudFront
        id: deploy
        env:
          VECNOVA_BUCKET: ${{ vars.VECNOVA_BUCKET }}
          VECNOVA_DISTRIBUTION_ID: ${{ vars.VECNOVA_DISTRIBUTION_ID }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_SITE_REPO_URL: ${{ vars.PUBLIC_SITE_REPO_URL }}
          PUBLIC_SITE_OWNER: ${{ vars.PUBLIC_SITE_OWNER }}
          PUBLIC_SITE_NIE: ${{ vars.PUBLIC_SITE_NIE }}
          PUBLIC_SITE_ADDRESS: ${{ vars.PUBLIC_SITE_ADDRESS }}
          PUBLIC_SITE_EMAIL: ${{ vars.PUBLIC_SITE_EMAIL }}
          PUBLIC_SITE_PHONE: ${{ vars.PUBLIC_SITE_PHONE }}
          PUBLIC_SITE_LOGO_PATH: ${{ vars.PUBLIC_SITE_LOGO_PATH }}
          PUBLIC_LAUNCH: ${{ vars.PUBLIC_LAUNCH }}
        run: ./scripts/deploy.sh

      - name: Wait for CloudFront invalidation
        env:
          VECNOVA_DISTRIBUTION_ID: ${{ vars.VECNOVA_DISTRIBUTION_ID }}
          INVALIDATION_ID: ${{ steps.deploy.outputs.invalidation_id }}
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id "${VECNOVA_DISTRIBUTION_ID}" \
            --id "${INVALIDATION_ID}"

      - name: Verify live site
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${PUBLIC_SITE_URL}")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Error: Esperado HTTP 200 de ${PUBLIC_SITE_URL}, recibido ${HTTP_STATUS}" >&2
            exit 1
          fi

          if ! curl -s -I "${PUBLIC_SITE_URL}" | grep -i '^x-frame-options:' > /dev/null; then
            echo "Error: No se encontro la cabecera x-frame-options en la respuesta de ${PUBLIC_SITE_URL}" >&2
            exit 1
          fi
