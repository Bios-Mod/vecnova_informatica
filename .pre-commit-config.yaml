repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: block-env-and-state
        name: bloquear .env reales, tfvars y state de Terraform
        entry: archivo prohibido, no se versiona
        language: fail
        files: '(^|/)\.env(\.(?!example$).*)?$|\.tfstate(\.|$)|\.tfvars$'
